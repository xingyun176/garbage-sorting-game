<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>垃圾分类大挑战 · 把城市变干净</title>
<meta name="description" content="垃圾分类大挑战：12 道题，答对一题城市干净一点，边玩边学垃圾分类。">
<meta property="og:title" content="垃圾分类大挑战">
<meta property="og:description" content="答对一题，城市干净一点。12 道题把灰霾小镇变回绿色家园，来试试你能拿几颗星？">
<meta property="og:type" content="website">
<meta name="theme-color" content="#ffffff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%E2%99%BB%EF%B8%8F%3C/text%3E%3C/svg%3E">
<style>
:root{
  --recycle:#2f7fe0;
  --hazard:#e2504c;
  --kitchen:#37a86b;
  --other:#7b8794;
  --ink:#22303c;
  --ink-2:#5b6b7a;
  --line:#e3eaf1;
  --card:#ffffff;
  --clean:0;
  --radius:20px;
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Segoe UI",system-ui,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;margin:0;}
body{
  display:flex;align-items:center;justify-content:center;
  background:#dfeaf3;
  background-image:
    radial-gradient(circle at 20% 10%, #ffffff 0%, transparent 55%),
    radial-gradient(circle at 85% 90%, #cfe4f5 0%, transparent 60%),
    linear-gradient(160deg,#eaf3fb 0%,#dbe9f4 100%);
  color:var(--ink);
  overflow:hidden;
  user-select:none;
}

/* ============ 外壳 ============ */
#app{
  position:relative;
  width:min(560px,100vw);
  height:min(900px,100dvh);
  background:var(--card);
  border-radius:0;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(30,60,90,.22);
  display:flex;flex-direction:column;
}
@media (min-width:600px) and (min-height:760px){
  #app{border-radius:28px;}
}
.screen{
  position:absolute;inset:0;
  display:flex;flex-direction:column;
  opacity:0;visibility:hidden;
  transition:opacity .38s ease, transform .38s cubic-bezier(.22,1,.36,1);
  transform:translateY(14px) scale(.985);
}
.screen.on{opacity:1;visibility:visible;transform:none;}

/* ============ 通用按钮 ============ */
.btn{
  border:0;cursor:pointer;
  font-family:inherit;font-weight:800;
  color:#fff;background:linear-gradient(180deg,#3fb27a,#2b9a64);
  border-radius:999px;
  padding:16px 40px;
  font-size:clamp(17px,4.6vw,20px);
  letter-spacing:.06em;
  box-shadow:0 10px 0 #1f7a4d, 0 16px 30px rgba(43,154,100,.4);
  transition:transform .12s ease, box-shadow .12s ease, filter .2s;
}
.btn:active{transform:translateY(6px);box-shadow:0 4px 0 #1f7a4d, 0 8px 16px rgba(43,154,100,.35);}
.btn.ghost{
  background:#fff;color:var(--ink-2);
  box-shadow:0 8px 0 #dde6ee, 0 14px 26px rgba(40,70,100,.14);
  font-weight:700;
}
.btn.ghost:active{box-shadow:0 3px 0 #dde6ee,0 6px 12px rgba(40,70,100,.14);}

/* ============ 开始页 ============ */
#startScreen{
  align-items:center;justify-content:center;
  padding:26px;
  text-align:center;
  background:
    radial-gradient(circle at 50% 8%, #eafaf1 0%, transparent 52%),
    linear-gradient(175deg,#ffffff 0%,#f2f8fd 100%);
  gap:2px;
}
.logo-emoji{
  font-size:clamp(60px,17vw,86px);line-height:1;
  animation:bob 2.6s ease-in-out infinite;
  filter:drop-shadow(0 12px 18px rgba(50,120,90,.28));
}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-3deg);}50%{transform:translateY(-14px) rotate(3deg);}}
#startScreen h1{
  margin:10px 0 6px;
  font-size:clamp(28px,8.2vw,38px);
  letter-spacing:.04em;
  background:linear-gradient(120deg,#2b9a64,#2f7fe0 70%);
  -webkit-background-clip:text;background-clip:text;color:transparent;
}
.sub{color:var(--ink-2);font-size:clamp(14px,4vw,16px);line-height:1.7;margin:0;}
.rules{
  width:100%;max-width:400px;
  margin:22px 0 26px;
  background:#fff;border:2px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;text-align:left;
  display:grid;gap:11px;
  box-shadow:0 10px 26px rgba(40,80,120,.08);
}
.rule{display:flex;gap:11px;align-items:flex-start;font-size:clamp(14px,3.9vw,15.5px);line-height:1.5;color:var(--ink-2);}
.rule b{color:var(--ink);font-weight:800;}
.rule .ic{font-size:19px;line-height:1.25;flex:none;}
.start-bins{display:flex;gap:9px;margin-bottom:24px;flex-wrap:wrap;justify-content:center;}
.mini-bin{
  display:flex;align-items:center;gap:6px;
  padding:7px 13px;border-radius:999px;
  font-size:clamp(12px,3.4vw,14px);font-weight:800;color:#fff;
}
.mini-bin.r{background:var(--recycle);}
.mini-bin.h{background:var(--hazard);}
.mini-bin.k{background:var(--kitchen);}
.mini-bin.o{background:var(--other);}

/* ============ 游戏页 ============ */
#gameScreen{background:linear-gradient(180deg,#eef6fd,#ffffff 62%);}
#gameScreen.shake{animation:shake .42s cubic-bezier(.36,.07,.19,.97);}
@keyframes shake{
  10%,90%{transform:translateX(-3px);}
  20%,80%{transform:translateX(5px);}
  30%,50%,70%{transform:translateX(-9px);}
  40%,60%{transform:translateX(9px);}
}

/* --- HUD --- */
.hud{
  flex:none;
  display:flex;align-items:center;gap:6px;
  padding:11px 12px 8px;
  background:#fff;
  z-index:6;
}
.hud-box{
  display:flex;align-items:center;gap:5px;
  background:#f3f8fc;border-radius:999px;
  padding:7px 11px;
  font-weight:800;font-size:clamp(12px,3.5vw,15px);
  color:var(--ink);line-height:1;white-space:nowrap;
}
.hud-box .lb{color:#93a3b1;font-weight:700;font-size:.86em;}
.hud-spacer{flex:1;}
.hearts{display:flex;gap:3px;font-size:clamp(15px,4.2vw,18px);line-height:1;}
.heart{transition:transform .3s, opacity .3s, filter .3s;}
.heart.dead{opacity:.22;filter:grayscale(1);transform:scale(.78);}
#comboBox{transition:transform .18s;}
#comboBox.hot{background:linear-gradient(180deg,#fff2d6,#ffe4b0);color:#a86400;}
#comboBox.pop{animation:pop .34s cubic-bezier(.22,1.6,.4,1);}
@keyframes pop{0%{transform:scale(1);}45%{transform:scale(1.22);}100%{transform:scale(1);}}
.snd{
  border:0;background:#f3f8fc;border-radius:999px;width:36px;height:36px;
  font-size:16px;cursor:pointer;line-height:1;color:var(--ink-2);
}
.snd:active{transform:scale(.92);}

/* --- 场景（会随答对逐渐变干净） --- */
.scene{
  position:relative;flex:1;min-height:110px;
  overflow:hidden;
  background:#c7d3dd;
}
.sky{position:absolute;inset:0;}
.sky-dirty{background:linear-gradient(180deg,#a9b6c1 0%,#c9d4dd 55%,#dfe7ee 100%);}
.sky-clean{
  background:linear-gradient(180deg,#54b4ee 0%,#9ed8f6 55%,#e6f7ff 100%);
  opacity:var(--clean);transition:opacity .9s ease;
}
.sun{
  position:absolute;top:9%;right:11%;
  width:clamp(34px,9vw,48px);height:clamp(34px,9vw,48px);border-radius:50%;
  background:radial-gradient(circle at 36% 34%,#fff8cf,#ffcf4d 70%);
  box-shadow:0 0 26px 10px rgba(255,214,80,.55);
  opacity:calc(.28 + var(--clean)*.72);
  transition:opacity .9s ease;
}
.cloud{
  position:absolute;height:auto;font-size:clamp(20px,6vw,30px);
  opacity:calc(.5 + var(--clean)*.35);
  transition:opacity .9s ease;
  filter:saturate(.4);
}
.cloud.c1{top:8%;left:-12%;animation:drift 26s linear infinite;}
.cloud.c2{top:26%;left:-30%;font-size:clamp(15px,4.5vw,22px);animation:drift 38s linear infinite 4s;}
@keyframes drift{from{transform:translateX(0);}to{transform:translateX(560px);}}

.haze{
  position:absolute;inset:0;
  background:radial-gradient(circle at 50% 60%,rgba(140,155,168,.55),transparent 70%);
  opacity:calc((1 - var(--clean)) * .95);
  transition:opacity .9s ease;
  pointer-events:none;
}
/* 地面 */
.ground{
  position:absolute;left:0;right:0;bottom:0;height:38%;
  background:linear-gradient(180deg,#b9c3b2 0%,#9aa78f 100%);
  transition:background .9s ease;
}
.ground::after{
  content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,#7fc98a 0%,#4aa86a 100%);
  opacity:var(--clean);transition:opacity .9s ease;
}
.trees{position:absolute;left:0;right:0;bottom:12%;height:60%;pointer-events:none;}
.tree{
  position:absolute;bottom:0;transform-origin:50% 100%;
  animation:grow .75s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes grow{from{transform:scale(0) translateY(10px);}to{transform:scale(1) translateY(0);}}
.tree .crown{font-size:clamp(22px,6.6vw,32px);line-height:1;display:block;filter:drop-shadow(0 4px 6px rgba(20,70,40,.22));}
.litter{
  position:absolute;bottom:6%;
  font-size:clamp(15px,4.4vw,21px);
  opacity:1;transition:opacity .6s ease, transform .6s ease;
  filter:grayscale(.35);
}
.litter.gone{opacity:0;transform:translateY(16px) scale(.4);}
/* 进度条 */
.progress{
  position:absolute;left:14px;right:14px;bottom:9px;height:9px;
  background:rgba(255,255,255,.55);border-radius:999px;overflow:hidden;
  box-shadow:inset 0 1px 3px rgba(30,60,90,.16);
}
.progress i{
  display:block;height:100%;width:0;border-radius:999px;
  background:linear-gradient(90deg,#5ed39b,#2b9a64);
  transition:width .55s cubic-bezier(.3,1.2,.4,1);
}
.scene-tag{
  position:absolute;top:10px;left:12px;
  background:rgba(255,255,255,.82);
  border-radius:999px;padding:5px 12px;
  font-size:clamp(11px,3.2vw,13px);font-weight:800;color:var(--ink-2);
  backdrop-filter:blur(4px);
}

/* --- 垃圾卡 --- */
.panel{
  flex:none;position:relative;z-index:5;
  display:flex;flex-direction:column;align-items:center;
  padding:6px 16px 4px;
  background:linear-gradient(180deg,rgba(255,255,255,0),#fff 42%);
}
.timer{
  width:min(300px,72%);height:8px;border-radius:999px;background:#eef3f8;
  overflow:hidden;margin-bottom:10px;
}
.timer i{display:block;height:100%;width:100%;border-radius:999px;background:linear-gradient(90deg,#57c9f0,#2f7fe0);}
.timer.warn i{background:linear-gradient(90deg,#ffb648,#f2723b);}
.card{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  width:min(210px,56vw);height:clamp(92px,25vw,118px);
  background:#fff;border:3px solid var(--line);border-radius:var(--radius);
  box-shadow:0 14px 34px rgba(40,80,120,.14);
  animation:float 3s ease-in-out infinite;
}
@keyframes float{0%,100%{transform:translateY(0);}50%{transform:translateY(-7px);}}
.card .emoji{font-size:clamp(40px,12vw,54px);line-height:1;}
.card .name{font-size:clamp(14px,4.1vw,17px);font-weight:800;margin-top:4px;letter-spacing:.04em;}
.card.wronggo{animation:drop .6s cubic-bezier(.4,0,.9,.5) forwards;}
@keyframes drop{to{transform:translateY(70px) rotate(26deg) scale(.7);opacity:0;}}
.ask{
  margin:10px 0 2px;font-size:clamp(13px,3.7vw,15px);font-weight:700;color:var(--ink-2);
}

/* --- 垃圾桶 --- */
.bins{
  flex:none;position:relative;z-index:4;
  display:grid;grid-template-columns:repeat(4,1fr);
  gap:6px;padding:8px 10px calc(12px + env(safe-area-inset-bottom));
  background:#fff;
}
.bin{
  border:0;background:none;padding:6px 2px 4px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  border-radius:16px;
  transition:transform .16s cubic-bezier(.22,1.5,.4,1), background .2s;
  font-family:inherit;
}
.bin:hover{background:#f5f9fd;}
.bin:active{transform:scale(.94);}
.bin .lid{
  width:76%;height:11px;border-radius:7px 7px 3px 3px;
  background:var(--c);position:relative;
  transition:transform .22s cubic-bezier(.3,1.6,.4,1);
  transform-origin:12% 100%;
  box-shadow:0 2px 0 rgba(0,0,0,.13);
}
.bin .body{
  width:84%;height:clamp(48px,13.5vw,62px);
  border-radius:7px 7px 14px 14px;
  background:linear-gradient(180deg,var(--c),var(--c2));
  position:relative;overflow:hidden;
  box-shadow:inset 0 -8px 14px rgba(0,0,0,.14);
}
.bin .body::before{
  content:"";position:absolute;top:16%;left:16%;width:14%;height:58%;
  background:rgba(255,255,255,.4);border-radius:99px;
}
.bin .body .gl{position:absolute;inset:0;background:radial-gradient(circle at 50% 110%,#fff,transparent 62%);opacity:0;}
.bin .label{
  font-size:clamp(12px,3.4vw,14.5px);font-weight:800;color:var(--ink);
  letter-spacing:-.02em;white-space:nowrap;
}
.bin .hint{font-size:clamp(10px,2.8vw,11.5px);color:#a8b6c2;font-weight:700;margin-top:-2px;}
@media (hover:none){ .bin .hint{display:none;} }
.bin.open .lid{transform:rotate(-24deg) translateY(-2px);}
.bin.hit{animation:binHit .5s cubic-bezier(.22,1.5,.4,1);}
@keyframes binHit{0%{transform:translateY(0) scale(1);}35%{transform:translateY(-9px) scale(1.07);}100%{transform:translateY(0) scale(1);}}
.bin.hit .body .gl{animation:glow .55s ease;}
@keyframes glow{0%{opacity:0;}40%{opacity:.95;}100%{opacity:0;}}
.bin.reveal .body{box-shadow:0 0 0 4px #2b9a64, 0 0 22px rgba(43,154,100,.6);}
.bin.reveal{animation:binHit .5s ease 2;}
.bin.wrongpick .body{box-shadow:0 0 0 4px #e2504c;}
.bin:disabled{cursor:default;}

/* --- 飘分 / 连击 --- */
.pops{position:absolute;inset:0;pointer-events:none;z-index:40;overflow:hidden;}
.pop-txt{
  position:absolute;font-weight:900;font-size:clamp(18px,5.4vw,24px);
  color:#2b9a64;text-shadow:0 3px 0 #fff,0 0 16px rgba(255,255,255,.9);
  animation:rise 1.1s ease-out forwards;white-space:nowrap;
}
.pop-txt.bad{color:#e2504c;}
.pop-txt.combo{color:#f08a1c;font-size:clamp(15px,4.6vw,20px);}
@keyframes rise{0%{transform:translate(-50%,0) scale(.6);opacity:0;}25%{transform:translate(-50%,-16px) scale(1.12);opacity:1;}100%{transform:translate(-50%,-72px) scale(1);opacity:0;}}

/* --- 反馈条 --- */
.feedback{
  position:absolute;left:0;right:0;bottom:0;z-index:50;
  transform:translateY(105%);
  transition:transform .4s cubic-bezier(.22,1.3,.4,1);
  padding:0 12px calc(12px + env(safe-area-inset-bottom));
  pointer-events:none;
}
.feedback.on{transform:none;}
.fb-inner{
  border-radius:18px;padding:13px 16px;
  background:#fff;
  border:3px solid #d7e6d9;
  box-shadow:0 -10px 34px rgba(30,60,90,.2);
}
.feedback.bad .fb-inner{border-color:#f3d5d4;}
.fb-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:clamp(15px,4.2vw,18px);color:#2b9a64;}
.feedback.bad .fb-title{color:#d64b47;}
.fb-title .big{font-size:1.25em;}
.fb-tip{
  margin-top:7px;font-size:clamp(13px,3.7vw,15px);line-height:1.55;color:var(--ink-2);
}
.fb-tip b{color:var(--ink);}
.fb-tip .tag{
  display:inline-block;padding:1px 8px;border-radius:999px;color:#fff;font-weight:800;
  font-size:.9em;margin-right:4px;
}

/* --- 粒子 --- */
.particle{
  position:absolute;width:9px;height:9px;border-radius:50%;
  pointer-events:none;z-index:45;
  animation:burst .72s cubic-bezier(.2,.7,.3,1) forwards;
}
@keyframes burst{
  0%{transform:translate(-50%,-50%) scale(.5);opacity:1;}
  100%{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0);opacity:0;}
}

/* ============ 结算页 ============ */
#endScreen{
  align-items:center;justify-content:center;text-align:center;
  padding:26px;
  background:radial-gradient(circle at 50% 12%,#fff9e0 0%,transparent 55%),linear-gradient(175deg,#ffffff,#f1f8fd);
  gap:6px;
}
#endScreen h2{margin:4px 0 0;font-size:clamp(24px,7vw,32px);letter-spacing:.04em;}
.stars{display:flex;gap:8px;font-size:clamp(32px,9.5vw,44px);margin:6px 0 2px;}
.stars span{opacity:.2;filter:grayscale(1);transform:scale(.8);transition:all .5s cubic-bezier(.2,1.6,.4,1);}
.stars span.lit{opacity:1;filter:none;transform:scale(1);}
.verdict{font-size:clamp(14px,4vw,16px);color:var(--ink-2);line-height:1.6;margin:0;max-width:380px;}
.stats{
  display:grid;grid-template-columns:repeat(3,1fr);gap:10px;
  width:100%;max-width:400px;margin:20px 0 24px;
}
.stat{
  background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:13px 6px;box-shadow:0 8px 20px rgba(40,80,120,.07);
}
.stat .v{font-size:clamp(20px,5.8vw,26px);font-weight:900;color:#2b9a64;line-height:1.1;}
.stat .k{font-size:clamp(11px,3.1vw,12.5px);color:#93a3b1;font-weight:700;margin-top:3px;}
.review{
  width:100%;max-width:400px;max-height:26vh;overflow:auto;
  text-align:left;background:#fff;border:2px solid var(--line);border-radius:16px;
  padding:12px 14px;margin-bottom:20px;
}
.review h4{margin:0 0 8px;font-size:13px;color:#93a3b1;letter-spacing:.08em;}
.review .row{display:flex;gap:8px;align-items:flex-start;font-size:13px;line-height:1.5;color:var(--ink-2);padding:5px 0;border-top:1px dashed #eef3f8;}
.review .row:first-of-type{border-top:0;}
.review .row .em{flex:none;font-size:16px;}
.review .row b{color:var(--ink);}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:2;}
.conf{position:absolute;width:10px;height:14px;border-radius:2px;top:-20px;animation:fall linear forwards;}
@keyframes fall{to{transform:translateY(105vh) rotate(720deg);opacity:.15;}}
.end-actions{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;position:relative;z-index:3;}

/* 移动端小高度优化 */
@media (max-height:660px){
  .card{height:80px;}
  .bin .body{height:42px;}
  .hud{padding:8px 12px 6px;}
  .trees{bottom:16%;}
}
</style>
</head>
<body>
<div id="app">

  <!-- ================= 开始页 ================= -->
  <section class="screen on" id="startScreen">
    <div class="logo-emoji">♻️</div>
    <h1>垃圾分类大挑战</h1>
    <p class="sub">每答对一题，城市就干净一点<br>12 道题，把灰霾小镇变回绿色家园</p>

    <div class="rules">
      <div class="rule"><span class="ic">👆</span><span>垃圾会飘到屏幕中央，把它 <b>投进正确的垃圾桶</b>（也可按键盘 <b>1 / 2 / 3 / 4</b>）</span></div>
      <div class="rule"><span class="ic">🌳</span><span>答对：垃圾飞进桶里 → 爆出光点 → <b>场景长出一棵树</b>，雾霾退散</span></div>
      <div class="rule"><span class="ic">🔥</span><span>连续答对有 <b>连击加成</b>，手速越快分数越高</span></div>
      <div class="rule"><span class="ic">💔</span><span>答错或超时扣 1 颗心，<b>3 颗心用完游戏结束</b></span></div>
    </div>

    <div class="start-bins">
      <span class="mini-bin r">🔵 可回收物</span>
      <span class="mini-bin h">🔴 有害垃圾</span>
      <span class="mini-bin k">🟢 厨余垃圾</span>
      <span class="mini-bin o">⚫ 其他垃圾</span>
    </div>

    <button class="btn" id="startBtn">开始挑战</button>
  </section>

  <!-- ================= 游戏页 ================= -->
  <section class="screen" id="gameScreen">
    <div class="hud">
      <div class="hud-box"><span class="lb">第</span><span id="qNow">1</span><span class="lb">/12 题</span></div>
      <div class="hud-box" id="comboBox"><span class="lb">连击</span><span id="comboVal">0</span></div>
      <div class="hud-spacer"></div>
      <div class="hud-box"><span class="lb">得分</span><span id="scoreVal">0</span></div>
      <div class="hearts" id="hearts"></div>

    ['口香糖','🍬','口香糖残渣属其他垃圾，别吐在地上哦。']
  ]
};

/* ===================== DOM ===================== */
var $ = function(id){ return document.getElementById(id); };
var startScreen=$('startScreen'), gameScreen=$('gameScreen'), endScreen=$('endScreen');
var elQNow=$('qNow'), elComboVal=$('comboVal'), elComboBox=$('comboBox'), elScore=$('scoreVal');
var elHearts=$('hearts'), elTrees=$('trees'), elScene=$('scene'), elSceneTag=$('sceneTag');
var elProgBar=$('progBar'), elTimerWrap=$('timerWrap'), elTimerBar=$('timerBar');
var elCard=$('card'), elTrashEmoji=$('trashEmoji'), elTrashName=$('trashName');
var elBins=$('bins'), elPops=$('pops'), elFeedback=$('feedback');
var elFbIcon=$('fbIcon'), elFbTitle=$('fbTitle'), elFbTip=$('fbTip');
var elSndBtn=$('sndBtn');
var elEndEmoji=$('endEmoji'), elEndTitle=$('endTitle'), elStars=$('stars'), elEndVerdict=$('endVerdict');
var elEndScore=$('endScore'), elEndAcc=$('endAcc'), elEndCombo=$('endCombo');
var elReview=$('review'), elConfetti=$('confetti');

/* ===================== 状态 ===================== */
var S = {
  queue: [], idx: 0, score: 0, combo: 0, maxCombo: 0,
  lives: LIVES, correct: 0, answered: 0, locked: true,
  timerId: null, deadline: 0, remain: 0, mistakes: [], trees: 0, running:false
};

/* ===================== 音效 ===================== */
var actx = null, muted = false;
function audio(){
  if(muted) return null;
  try{
    if(!actx){ var AC = window.AudioContext || window.webkitAudioContext; if(!AC) return null; actx = new AC(); }
    if(actx.state === 'suspended') actx.resume();
    return actx;
  }catch(e){ return null; }
}
function tone(freq, dur, type, vol, delay){
  var a = audio(); if(!a) return;
  var t0 = a.currentTime + (delay||0);
  var o = a.createOscillator(), g = a.createGain();
  o.type = type || 'sine'; o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol || .08, t0 + .012);
  g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
  o.connect(g); g.connect(a.destination);
  o.start(t0); o.stop(t0 + dur + .03);
}
function sndTap(){ tone(520, .06, 'triangle', .045, 0); }
function sndGood(){
  tone(660, .1, 'sine', .07, 0);
  tone(880, .12, 'sine', .07, .08);
  tone(1180, .16, 'sine', .05, .17);
}
function sndBad(){
  tone(200, .16, 'sawtooth', .05, 0);
  tone(140, .22, 'sawtooth', .045, .1);
}
function sndWin(){
  [523,659,784,1046].forEach(function(f,i){ tone(f, .28, 'sine', .07, i*.13); });
}
function sndLose(){ [420,340,260,180].forEach(function(f,i){ tone(f,.3,'triangle',.055,i*.15); }); }

/* ===================== 工具 ===================== */
function shuffle(a){
  for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; }
  return a;
}
function showScreen(el){
  [startScreen, gameScreen, endScreen].forEach(function(s){ s.classList.toggle('on', s===el); });
}
function popText(txt, x, y, cls){
  var d = document.createElement('div');
  d.className = 'pop-txt' + (cls ? ' ' + cls : '');
  d.textContent = txt;
  d.style.left = x + 'px';
  d.style.top = y + 'px';
  elPops.appendChild(d);
  setTimeout(function(){ d.remove(); }, 1150);
}
function burst(x, y, color, n){
  n = n || 14;
  for(var i=0;i<n;i++){
    var p = document.createElement('div');
    p.className = 'particle';
    var ang = (Math.PI*2*i/n) + Math.random()*.5;
    var dist = 34 + Math.random()*62;
    p.style.setProperty('--dx', Math.cos(ang)*dist + 'px');
    p.style.setProperty('--dy', Math.sin(ang)*dist + 'px');
    p.style.left = x + 'px';
    p.style.top = y + 'px';
    p.style.background = color;
    p.style.width = p.style.height = (6 + Math.random()*7) + 'px';
    if(Math.random() > .5) p.style.borderRadius = '3px';
    elPops.appendChild(p);
    (function(el){ setTimeout(function(){ el.remove(); }, 780); })(p);
  }
}

/* ===================== 初始化垃圾桶 ===================== */
function buildBins(){
  elBins.innerHTML = '';
  ORDER.forEach(function(key, i){
    var c = CATS[key];
    var b = document.createElement('button');
    b.className = 'bin';
    b.type = 'button';
    b.dataset.cat = key;
    b.style.setProperty('--c', c.color);
    b.style.setProperty('--c2', c.dark);
    b.innerHTML =
      '<span class="lid"></span>' +
      '<span class="body"><span class="gl"></span></span>' +
      '<span class="label">' + c.name + '</span>' +
      '<span class="hint">按 ' + (i+1) + '</span>';
    b.addEventListener('click', function(){ pick(key, b); });
    elBins.appendChild(b);
  });
}

/* ===================== 开始一局 ===================== */
function newGame(){
  S.queue = buildQueue();
  S.idx = 0; S.score = 0; S.combo = 0; S.maxCombo = 0;
  S.lives = LIVES; S.correct = 0; S.answered = 0;
  S.locked = true; S.mistakes = []; S.trees = 0; S.running = true;

  elTrees.innerHTML = '';
  elPops.innerHTML = '';
  elFeedback.classList.remove('on','bad');
  elScene.style.setProperty('--clean', 0);
  elProgBar.style.width = '0%';
  elSceneTag.textContent = '空气质量：重度污染';
  buildLitter();
  renderHearts();
  renderHUD();
  elCard.className = 'card';
  elCard.style.transition = 'none';
  elCard.style.transform = '';
  elCard.style.opacity = '';
  void elCard.offsetWidth;
  elCard.style.transition = '';
  showScreen(gameScreen);
  setTimeout(nextQuestion, 420);
}

/* 每类各取 TOTAL_Q/4 题，保证四种桶都练到 */
function buildQueue(){
  var per = Math.floor(TOTAL_Q / ORDER.length);
  var extra = TOTAL_Q - per * ORDER.length;
  var picked = [];
  ORDER.forEach(function(key, i){
    var pool = shuffle(BANK[key].slice());
    var n = per + (i < extra ? 1 : 0);
    for(var k=0;k<n;k++){
      var it = pool[k % pool.length];
      picked.push({ name:it[0], emoji:it[1], tip:it[2], cat:key });
    }
  });
  return shuffle(picked);
}

/* ===================== HUD ===================== */
function renderHUD(){
  elQNow.textContent = Math.min(S.idx + 1, TOTAL_Q);
  elScore.textContent = S.score;
  elComboVal.textContent = S.combo;
  elComboBox.classList.toggle('hot', S.combo >= 2);
}
function renderHearts(){
  elHearts.innerHTML = '';
  for(var i=0;i<LIVES;i++){
    var s = document.createElement('span');
    s.className = 'heart' + (i < S.lives ? '' : ' dead');
    s.textContent = i < S.lives ? '❤️' : '🤍';
    elHearts.appendChild(s);
  }
}

/* ===================== 场景装饰 ===================== */
var LITTER_EMOJI = ['🥫','🧻','🍌','📦','🥤','🗑️','🩹','💊'];
function buildLitter(){
  var old = elScene.querySelectorAll('.litter');
  for(var i=0;i<old.length;i++) old[i].remove();
  var n = 9;
  for(var k=0;k<n;k++){
    var d = document.createElement('span');
    d.className = 'litter';
    d.textContent = LITTER_EMOJI[k % LITTER_EMOJI.length];
    d.style.left = (3 + Math.random()*88) + '%';
    d.style.bottom = (3 + Math.random()*22) + '%';
    d.style.transform = 'rotate(' + (Math.random()*60-30) + 'deg)';
    elScene.appendChild(d);
  }
}
function cleanStep(){
  var lit = elScene.querySelectorAll('.litter:not(.gone)');
  if(lit.length) lit[0].classList.add('gone');

  var ratio = S.correct / TOTAL_Q;
  elScene.style.setProperty('--clean', ratio.toFixed(3));
  elProgBar.style.width = (ratio*100) + '%';

  if(ratio < .25) elSceneTag.textContent = '空气质量：重度污染';
  else if(ratio < .5) elSceneTag.textContent = '空气质量：中度污染';
  else if(ratio < .75) elSceneTag.textContent = '空气质量：轻度污染';
  else if(ratio < 1) elSceneTag.textContent = '空气质量：良';
  else elSceneTag.textContent = '空气质量：优 · 城市焕新！';

  growTree();
}
function growTree(){
  S.trees++;
  var t = document.createElement('div');
  t.className = 'tree';
  var icons = ['🌳','🌲','🌴','🌳','🌲'];
  var crown = document.createElement('span');
  crown.className = 'crown';
  crown.textContent = icons[S.trees % icons.length];
  t.appendChild(crown);
  var left = 4 + Math.random()*82;
  t.style.left = left + '%';
  t.style.bottom = (Math.random()*16) + '%';
  var sc = (.72 + Math.random()*.5).toFixed(2);
  t.style.transformOrigin = '50% 100%';
  crown.style.fontSize = 'calc(clamp(22px,6.6vw,32px) * ' + sc + ')';
  elTrees.appendChild(t);
}

/* ===================== 出题 ===================== */
function nextQuestion(){
  if(!S.running) return;
  if(S.idx >= TOTAL_Q || S.lives <= 0){ endGame(); return; }

  var q = S.queue[S.idx];
  S.current = q;
  S.locked = false;

  elCard.className = 'card';
  elCard.style.transition = 'none';
  elCard.style.transform = '';
  elCard.style.opacity = '';
  void elCard.offsetWidth;
  elCard.style.transition = '';
  elTrashEmoji.textContent = q.emoji;
  elTrashName.textContent = q.name;

  var all = elBins.querySelectorAll('.bin');
  for(var i=0;i<all.length;i++){
    all[i].classList.remove('hit','reveal','wrongpick','open');
    all[i].disabled = false;
  }
  elFeedback.classList.remove('on','bad');
  renderHUD();
  startTimer();
}

function startTimer(){
  stopTimer();
  S.deadline = Date.now() + TIME_PER_Q;
  elTimerWrap.classList.remove('warn');
  elTimerBar.style.width = '100%';
  elTimerBar.style.transition = 'none';
  void elTimerBar.offsetWidth;
  elTimerBar.style.transition = 'width .12s linear';
  S.timerId = setInterval(function(){
    var left = S.deadline - Date.now();
    if(left <= 0){
      stopTimer();
      elTimerBar.style.width = '0%';
      if(!S.locked) pick(null, null);
      return;
    }
    var r = left / TIME_PER_Q;
    elTimerBar.style.width = (r*100) + '%';
    elTimerWrap.classList.toggle('warn', r < .34);
  }, 90);
}
function stopTimer(){
  if(S.timerId){ clearInterval(S.timerId); S.timerId = null; }
}

/* ===================== 作答 ===================== */
function pick(cat, binEl){
  if(S.locked || !S.running) return;
  S.locked = true;
  stopTimer();
  S.remain = Math.max(0, S.deadline - Date.now());

  var q = S.current;
  var all = elBins.querySelectorAll('.bin');
  for(var i=0;i<all.length;i++) all[i].disabled = true;

  var ok = (cat === q.cat);
  S.answered++;

  if(ok){
    S.correct++;
    S.combo++;
    if(S.combo > S.maxCombo) S.maxCombo = S.combo;
    renderHUD();
    if(S.combo >= 2){
      elComboBox.classList.remove('pop');
      void elComboBox.offsetWidth;
      elComboBox.classList.add('pop');
    }

    var speedBonus = Math.round(S.remain / TIME_PER_Q * 60);
    var comboBonus = Math.min(S.combo - 1, 5) * 20;
    var gain = 100 + speedBonus + comboBonus;
    S.score += gain;
    elScore.textContent = S.score;

    if(binEl){
      binEl.classList.add('open','hit');
      setTimeout(function(){ binEl.classList.remove('open'); }, 260);
    }
    sndGood();
    flyToBin(binEl || elBins.querySelector('[data-cat="' + q.cat + '"]'), function(){
      if(binEl){
        var br = binEl.getBoundingClientRect();
        var gr0 = gameScreen.getBoundingClientRect();
        burst(br.left + br.width/2 - gr0.left, br.top + br.height*0.3 - gr0.top, CATS[q.cat].color, 16);
      }
    });

    var cr = elCard.getBoundingClientRect();
    var gr = gameScreen.getBoundingClientRect();
    popText('+' + gain, cr.left - gr.left + cr.width/2, cr.top - gr.top + 6, '');
    if(S.combo >= 2){
      popText('连击 ×' + S.combo, cr.left - gr.left + cr.width/2, cr.top - gr.top - 34, 'combo');
    }
    cleanStep();

    setTimeout(function(){ showFeedback(true, q); }, 620);
    setTimeout(function(){
      hideFeedback();
      S.idx++;
      setTimeout(nextQuestion, 240);
    }, 1750);
  } else {
    S.combo = 0;
    S.lives--;
    renderHearts();
    S.mistakes.push(q);
    sndBad();
    gameScreen.classList.add('shake');
    setTimeout(function(){ gameScreen.classList.remove('shake'); }, 460);

    if(binEl) binEl.classList.add('wrongpick');
    var rightBin = elBins.querySelector('[data-cat="' + q.cat + '"]');
    if(rightBin) rightBin.classList.add('reveal');
    elCard.classList.add('wronggo');

    var cr2 = elCard.getBoundingClientRect();
    var gr2 = gameScreen.getBoundingClientRect();
    popText(cat === null ? '超时了' : '投错桶啦', cr2.left - gr2.left + cr2.width/2, cr2.top - gr2.top + 6, 'bad');
    renderHUD();

    setTimeout(function(){ showFeedback(false, q, cat === null); }, 620);
    setTimeout(function(){
      hideFeedback();
      S.idx++;
      if(S.lives <= 0){ setTimeout(endGame, 260); }
      else setTimeout(nextQuestion, 240);
    }, 2450);
  }
}

/* 垃圾飞进桶里的动画 */
function flyToBin(binEl, cb){
  if(!binEl){ if(cb) cb(); return; }
  var a = elCard.getBoundingClientRect();
  var b = binEl.getBoundingClientRect();
  var dx = (b.left + b.width/2) - (a.left + a.width/2);
  var dy = (b.top + b.height*0.34) - (a.top + a.height/2);
  elCard.style.transition = 'transform .58s cubic-bezier(.45,-0.35,.65,1), opacity .58s ease';
  elCard.style.transform = 'translate(' + dx + 'px,' + dy + 'px) scale(.22) rotate(' + (dx>0?220:-220) + 'deg)';
  elCard.style.opacity = '0';
  setTimeout(function(){ if(cb) cb(); }, 520);
}

/* ===================== 反馈条 ===================== */
function showFeedback(ok, q, timeout){
  var c = CATS[q.cat];
  elFeedback.classList.toggle('bad', !ok);
  if(ok){
    elFbIcon.textContent = '✅';
    elFbTitle.textContent = S.combo >= 2 ? ('答对啦！连击 ×' + S.combo) : '答对啦！';
    elFbTip.innerHTML = '<span class="tag" style="background:' + c.color + '">' + c.name + '</span><b>' + q.name + '</b> 投对了。' + q.tip;
  }else{
    elFbIcon.textContent = timeout ? '⏰' : '❌';
    elFbTitle.textContent = timeout ? '时间到啦' : '投错桶啦';
    elFbTip.innerHTML = '<b>' + q.name + '</b> 应该投进 <span class="tag" style="background:' + c.color + '">' + c.name + '</span>。' + q.tip;
  }
  elFeedback.classList.add('on');
}
function hideFeedback(){ elFeedback.classList.remove('on'); }

/* ===================== 结算 ===================== */
function endGame(){
  S.running = false;
  stopTimer();
  hideFeedback();
  var total = S.answered || 1;
  var acc = Math.round(S.correct / total * 100);

  var star = 1;
  if(acc >= 65) star = 2;
  if(acc >= 90) star = 3;
  if(S.correct === TOTAL_Q) star = 3;

  var sp = elStars.querySelectorAll('span');
  for(var i=0;i<sp.length;i++) sp[i].classList.remove('lit');
  for(var j=0;j<star;j++){
    (function(el, d){ setTimeout(function(){ el.classList.add('lit'); tone(700 + d*160, .2, 'sine', .06, 0); }, 260 + d*230); })(sp[j], j);
  }

  elEndScore.textContent = S.score;
  elEndAcc.textContent = acc + '%';
  elEndCombo.textContent = S.maxCombo;

  if(S.correct === TOTAL_Q){
    elEndEmoji.textContent = '🏞️';
    elEndTitle.textContent = '完美通关！';
    elEndVerdict.textContent = '全对！这座小镇的天空彻底放晴了，你就是分类小达人 🌈';
  }else if(star === 3){
    elEndEmoji.textContent = '🌳';
    elEndTitle.textContent = '环保达人！';
    elEndVerdict.textContent = '答对 ' + S.correct + ' 题，城市已经绿意盎然。再练练细节就完美啦！';
  }else if(star === 2){
    elEndEmoji.textContent = '🌤️';
    elEndTitle.textContent = '还不错！';
    elEndVerdict.textContent = '答对 ' + S.correct + ' 题，天空已经放晴。看看下面的错题，再来一次吧！';
  }else{
    elEndEmoji.textContent = '🌫️';
    elEndTitle.textContent = '继续加油！';
    elEndVerdict.textContent = '答对 ' + S.correct + ' 题，城市还有点灰。下面的易错点记牢，下一局一定能变绿！';
  }

  if(S.mistakes.length){
    elReview.style.display = '';
    var html = '<h4>易错回顾 · 记住它们</h4>';
    S.mistakes.forEach(function(q){
      var c = CATS[q.cat];
      html += '<div class="row"><span class="em">' + q.emoji + '</span><span><b>' + q.name + '</b> → <b style="color:' + c.color + '">' + c.name + '</b><br>' + q.tip + '</span></div>';
    });
    elReview.innerHTML = html;
  }else{
    elReview.style.display = 'none';
  }

  makeConfetti(star >= 3);
  showScreen(endScreen);
  if(S.lives > 0 && S.correct >= TOTAL_Q * .5) sndWin(); else sndLose();
}

function makeConfetti(big){
  elConfetti.innerHTML = '';
  var colors = ['#2f7fe0','#37a86b','#ffc93c','#e2504c','#57c9f0','#f08a1c','#8ad6a0'];
  var n = big ? 60 : 26;
  for(var i=0;i<n;i++){
    var d = document.createElement('div');
    d.className = 'conf';
    d.style.left = Math.random()*100 + '%';
    d.style.background = colors[Math.floor(Math.random()*colors.length)];
    d.style.animationDuration = (2 + Math.random()*1.8) + 's';
    d.style.animationDelay = (Math.random()*1.2) + 's';
    d.style.width = (7 + Math.random()*7) + 'px';
    d.style.height = (10 + Math.random()*10) + 'px';
    elConfetti.appendChild(d);
  }
  setTimeout(function(){ elConfetti.innerHTML = ''; }, 5200);
}

/* ===================== 交互绑定 ===================== */
$('startBtn').addEventListener('click', function(){ sndTap(); newGame(); });
$('againBtn').addEventListener('click', function(){ sndTap(); newGame(); });
$('homeBtn').addEventListener('click', function(){ sndTap(); showScreen(startScreen); });

elSndBtn.addEventListener('click', function(){
  muted = !muted;
  elSndBtn.textContent = muted ? '🔇' : '🔊';
  if(!muted) sndTap();
});

document.addEventListener('keydown', function(e){
  if(!gameScreen.classList.contains('on') || S.locked || !S.running) return;
  var n = parseInt(e.key, 10);
  if(n >= 1 && n <= 4){
    var b = elBins.querySelectorAll('.bin')[n-1];
    if(b) pick(ORDER[n-1], b);
  }
});

/* 阻止移动端双击缩放 */
document.addEventListener('gesturestart', function(e){ e.preventDefault(); });

buildBins();
})();
</script>
